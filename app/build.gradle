apply plugin: 'com.android.application'

android {
    signingConfigs {
        debug {
/*
            //https://stackoverflow.com/questions/27872959/android-error-app-has-same-packaged-different-signature
            storeFile file('/Users/jeremy/AndroidStudioProjects/keystore.jks')
            storePassword ''
            keyAlias = ''
            keyPassword ''
*/
        }
    }

    compileSdk 36
    defaultConfig {
        applicationId "com.philolog.philologus"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 15
        versionName '1.5.2'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug {
            //minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    productFlavors {
    }
    namespace 'com.philolog.philologus'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    dependenciesInfo {
        includeInApk true
        includeInBundle true
    }
}
dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    //https://github.com/jgilfelt/android-sqlite-asset-helper
    //implementation 'com.readystatesoftware.sqliteasset:sqliteassethelper:2.0.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
